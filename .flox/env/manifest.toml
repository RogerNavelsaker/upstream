schema-version = "1.10.0"

[install]

[vars]

[hook]
on-activate = '''
  # Guard: Only run in the physical meta-repo directory
  if [ "$(pwd -P)" != "/home/rona/Repositories/RogerNavelsaker/upstream" ]; then
    return
  fi

  # Symlink upstream repos
  for r in ../../jayminwest/os-eco ../../jayminwest/overstory ../../jayminwest/sapling ../../jayminwest/seeds ../../jayminwest/mulch ../../jayminwest/canopy ../../jayminwest/mycelium ../../jayminwest/greenhouse ../../jayminwest/kotadb ../../Dicklesworthstone/beads_viewer ../../Dicklesworthstone/agentic_coding_flywheel_setup ../../Dicklesworthstone/beads_rust ../../Dicklesworthstone/destructive_command_guard ../../Dicklesworthstone/coding_agent_session_search ../../Dicklesworthstone/cass_memory_system ../../Dicklesworthstone/ultimate_bug_scanner ../../Dicklesworthstone/ntm ../../Dicklesworthstone/meta_skill ../../Dicklesworthstone/slb ../../Dicklesworthstone/repo_updater ../../Dicklesworthstone/pi_agent_rust ../../Dicklesworthstone/mcp_agent_mail_rust ../../Dicklesworthstone/cross_agent_session_resumer ../../Dicklesworthstone/markdown_web_browser ../../Dicklesworthstone/your-source-to-prompt.html ../../Dicklesworthstone/misc_coding_agent_tips_and_scripts ../../yvgude/lean-ctx ../../yvgude/lean-ctl; do
    if [ -d "$r" ] && [ "$(basename "$r")" != "upstream" ]; then
      ln -snf "$r" .
    fi
  done
'''
